name: generate-javadoc

on:
  workflow_dispatch:
    inputs:
      mod:
        description: "Which mod to update (empty = all)"
        required: false
  schedule:
    - cron: '0 6 * * 1'  # weekly

jobs:
  javadoc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Define your mods here — repo + the package to extract
        mod:
          - repo: "ScaredsMods/PotionTotems"
            slug: "potion_totems"
          - repo: "ScaredsMods/ScaredsFactions"
            slug: "scareds_factions"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find javadoc jar in latest release
        id: find
        run: |
          URL=$(curl -s "https://api.github.com/repos/${{ matrix.mod.repo }}/releases/latest" \
            | jq -r '.assets[] | select(.name | endswith("-javadoc.jar")) | .browser_download_url')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "no-javadoc=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download & extract
        if: steps.find.outputs.no-javadoc != 'true'
        run: |
          curl -sL -o javadoc.jar "${{ steps.find.outputs.url }}"
          mkdir -p "public/${{ matrix.mod.slug }}/javadoc"
          jar xf javadoc.jar -C "public/${{ matrix.mod.slug }}/javadoc"

      - name: Commit
        if: steps.find.outputs.no-javadoc != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/${{ matrix.mod.slug }}/javadoc"
          git diff --cached --quiet || git commit -m "Update ${MOD} javadoc"
          git push   