name: generate-javadoc

on:
  # Trigger when a new release is published in the mod repo
  repository_dispatch:
    types: [mod-released]
  workflow_dispatch:

jobs:
  javadoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # --- Option A: download from Modrinth ---
      - name: Get sources jar from Modrinth
        id: modrinth
        run: |
          # Get latest version
          VERSION=$(curl -s "https://api.modrinth.com/v2/project/YOUR_PROJECT_ID/version" \
            | jq -r '.[0].version_number')
          # Get the sources jar URL
          URL=$(curl -s "https://api.modrinth.com/v2/project/YOUR_PROJECT_ID/version/$VERSION" \
            | jq -r '.files[] | select(.file_type=="sources-jar") | .url')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download & extract
        run: |
          curl -L -o sources.jar "${{ steps.modrinth.outputs.url }}"
          mkdir -p sources
          jar xf sources.jar -C sources

      # --- Option B: download from GitHub Releases instead ---
      # - name: Download from GitHub Releases
      #   run: |
      #     LATEST=$(curl -s https://api.github.com/repos/OWNER/REPO/releases/latest \
      #       | jq -r '.assets[] | select(.name | endswith("-sources.jar")) | .browser_download_url')
      #     curl -L -o sources.jar "$LATEST"
      #     mkdir -p sources && jar xf sources.jar -C sources

      - name: Generate Javadoc
        run: |
          javadoc -d public/javadoc \
            -sourcepath sources \
            -subpackages com.yourpackage \
            -classpath "libs/your-dependencies.jar" \
            -quiet

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/javadoc
          git diff --cached --quiet || git commit -m "Update Javadoc"
          git push   